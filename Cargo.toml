[workspace]
members = ["croissant-macros"]
resolver = "3"

[package]
name = "croissant"
version = "0.1.0"
edition = "2024"

[features]
default = ["derive"]
derive = ["dep:croissant-macros"]
crossterm = ["dep:crossterm"]
watch = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
croissant-macros = { path = "croissant-macros", version = "0.1.0", optional = true }
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["full"] }
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.7", optional = true }
